[package]
name = "tube-leak"
version = "0.1.0"
description = "Кросс-платформенное десктопное приложение для скачивания видео с YouTube"
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["process", "time", "io-util", "macros", "rt-multi-thread"] }

[dev-dependencies]
tempfile = "3"
