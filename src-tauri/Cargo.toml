[package]
name = "tube-leak"
version = "0.1.0"
description = "Кросс-платформенное десктопное приложение для скачивания видео с YouTube"
edition = "2021"
# 1.83, а не 1.77: поле и до TL-18 говорило неправду — `Option::is_none_or`
# в src/sidecar/resolve.rs требует 1.82, а `io::ErrorKind::StorageFull` в
# src/ytdlp/unpack.rs — 1.83. Решение владельца: поднять значение, проверку
# MSRV в CI не заводить. То есть поле остаётся утверждением на дисциплине,
# и разойтись с реальностью снова ему ничто не мешает.
rust-version = "1.83"

[build-dependencies]
tauri-build = { version = "2", features = [] }
# Читает src-tauri/binaries.lock.json в build.rs: версия и sha256 вложенного
# onedir-архива yt-dlp объявлены в пине один раз и пробрасываются в код
# через cargo:rustc-env, а не дублируются Rust-константами (TL-12).
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Сверка вложенного архива yt-dlp с sha256 из пина перед укладкой в ресурсы
# бандла (TL-25). Новых крейтов в сборку не добавляет: sha2 уже есть в графе
# на host-стороне (tauri-codegen), а build-зависимости резолвятся туда же.
sha2 = "0.10"

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["process", "time", "io-util", "macros", "rt-multi-thread", "sync"] }
# Распаковка onedir-архива yt-dlp в каталог данных при первом запуске
# (TL-12) и — тем же кодом — распаковка обновлений yt-dlp в E6. Только
# чтение и только deflate: остальные кодеки апстрим не использует.
zip = { version = "4", default-features = false, features = ["deflate-flate2"] }
# Бэкенд flate2 выбирается здесь, и это не педантизм (TL-25). Фича
# `deflate-flate2` у zip включает сам крейт flate2, но НЕ включает ему ни
# одного бэкенда сжатия — их у zip отдельные фичи (deflate-flate2-zlib,
# -zlib-rs). Пока бэкенд не выбран, flate2 не собирается вообще:
# `compile_error!("No compression backend selected")`.
#
# До TL-25 это не проявлялось на macOS и потому оставалось незамеченным:
# бэкенд прилетал по unification из чужой ветки графа — flate2/default у
# png ← muda. Ветка macOS-only не по нашей воле, а по манифесту muda:
# `[target.'cfg(target_os = "macos")'.dependencies.png]`. На Linux и Windows
# png на target-стороне графа нет вовсе, и flate2 там оставался без бэкенда;
# падала и сборка бандла тоже, то есть джоб build на этих двух платформах
# был красный с TL-12, но живьём его не гоняли (Р-6).
#
# Проверяется так (`-i` — обратное дерево, `--target` обязателен, см. ниже):
#
#   cargo tree -e normal -i flate2 --target x86_64-unknown-linux-gnu
#     flate2 |                                    ← пусто: compile_error!
#     └── zip | _deflate-any,deflate-flate2 → tube-leak
#     flate2 | any_impl,default,miniz_oxide,rust_backend
#     └── png ← ico ← tauri-codegen ← tauri-macros (proc-macro) ← tauri
#
# Ветка png ← ico ← tauri-codegen присутствует на ВСЕХ тройках, включая
# Linux и Windows, но замаскировать ничего не может: она идёт через
# proc-macro, а resolver v2 не объединяет фичи host- и target-стороны —
# отсюда в дереве два отдельных узла flate2 с разными наборами фич.
# Смотреть надо с явным `--target`: без него cargo tree схлопывает обе
# стороны в один узел, и разницы не видно. Что расхождение реально, а не
# артефакт отображения, показал прогон #26: на ubuntu падал и `cargo
# clippy` (без --target), и `tauri build --target x86_64-unknown-linux-gnu`.
#
# Следствие, важное за пределами этой строки. Расхождение возникает на
# target-стороне графа, а маскирует его зависимость, объявленная macOS-only.
# Значит джоб test, который после TL-25 гоняется на macos-latest, этот класс
# дефектов не ловит by construction: конфигурация фич под другие тройки на
# нём просто не резолвится. Этот дефект нашли ubuntu-прогоны (#26) — на
# macOS он не нашёлся бы никогда. Единственный сторож класса «собирается на
# macOS, не собирается под другую тройку» сейчас — матрица build; см. #37.
#
# Явная зависимость с `rust_backend` вместо zip-фичи `deflate-flate2-zlib-rs`:
# rust_backend — это miniz_oxide, который в графе уже есть (тот же png), то
# есть выбор бэкенда не добавляет в сборку ни одного нового крейта и не
# тянет C-зависимостей. Крейт не используется из кода напрямую намеренно:
# он здесь ради фичи.
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
# Свободное место на томе перед распаковкой дерева yt-dlp (TL-18).
# Своей реализации нет намеренно: под Unix это `statvfs`, под Windows —
# пара `GetDiskFreeSpaceExW` + `GetDiskFreeSpaceW`, и оба вызова FFI-шные.
# Писать их самим значило бы держать unsafe-код, из которого живьём
# проверяется ровно одна ветка: машин под Windows и Linux в проекте нет
# (Р-6), а молча неверный ответ про свободное место — это отказ установки
# на ровном месте у всех пользователей платформы.
#
# В Cargo.lock прибавляется один крейт — сам fs4. В релизном графе
# прибавляется больше, и назвать это стоит точно (ревью TL-18). Под
# Windows fs4 ходит через windows-sys, который и правда уже приходит с
# tauri. Под Unix — через rustix (safe-обёртка, unsafe остаётся в ней), а
# rustix до TL-18 был в графе только через tempfile, то есть через
# dev-зависимость; значит на macOS и Linux эта строка вводит его в
# РЕЛИЗНЫЙ граф впервые.
#
# Сколько именно крейтов прибавляется — измерено, а не прикинуто: набор
# `cargo tree -e normal --target <тройка> --prefix none` сравнён с самим
# собой при закомментированной этой строке. Разница по тройкам:
#
#   x86_64-pc-windows-msvc     fs4                                  (1)
#   aarch64-apple-darwin       fs4, rustix                          (2)
#   x86_64-unknown-linux-gnu   fs4, rustix, linux-raw-sys           (3)
#
# errno в этот список не входит вопреки первому впечатлению: на Linux он
# уже в релизном графе через signal-hook-registry ← tokio ← tauri, а на
# macOS rustix обходится без него.
#
# Свои фичи на этих зависимостях fs4 объявляет сам, поэтому урок flate2
# (см. выше: зависимость от фичи, включённой чужой веткой графа) здесь не
# повторяется — проверено `cargo tree --target` по всем трём тройкам.
#
# `default-features = false`: по умолчанию fs4 включает блокировки файлов
# для async-рантаймов, а нужны из него три функции про свободное место,
# и они не за фичами.
fs4 = { version = "1.1.0", default-features = false }
# sha256 архива обновления, считается на лету по принимаемому потоку
# (TL-56, Ф-3: распаковка только после совпадения суммы).
#
# В Cargo.lock не прибавляется ни строки: sha2 в графе уже был, но только
# на host-стороне — через tauri-codegen ← tauri-macros, то есть как
# зависимость proc-macro, и в бинарник приложения не попадал. Resolver v2
# не объединяет host- и target-стороны, поэтому после этой строки в дереве
# два узла sha2, и второй — наш:
#
#   cargo tree -e normal -i sha2 --target aarch64-apple-darwin
#     sha2 → tauri-codegen ← tauri-macros (proc-macro) ← tauri ← tube-leak
#     sha2 → tube-leak
#
# Значит цена измеряется не в новых крейтах лока, а в новых крейтах,
# которые теперь собираются ПОД ЦЕЛЕВУЮ тройку. Поддерево sha2 снято
# `cargo tree -e normal --target <тройка> -p sha2` и на всех трёх тройках
# совпадает до строки: sha2 → cfg-if, cpufeatures → libc, digest →
# block-buffer → generic-array → typenum, crypto-common. Из девяти узлов
# cfg-if и libc в целевом графе уже были, и не «где-то у tauri», а по
# проверенным путям: libc ← tokio, cfg-if ← crc32fast ← flate2 ← zip —
# обе цепочки идут от наших же прямых зависимостей, минуя proc-macro.
# Новых семь:
# sha2, cpufeatures, digest, block-buffer, generic-array, typenum,
# crypto-common. Все — чистый Rust без системных библиотек и без
# C-сборки, и ни один не объявляет зависимостей под конкретную
# платформу, поэтому расхождения по тройкам, каким был дефект flate2
# (см. выше), этот набор дать не может — проверено тем же
# `cargo tree --target`, что и там.
#
# Своей реализации sha256 нет намеренно, и это не про удобство:
# собственный хеш — это код, который обязан быть верным побитово, а
# проверить его нечем, кроме тех же опубликованных векторов, по которым
# его и пишут. Тот же крейт той же версии уже сверяет вложенный архив с
# пином в build.rs (TL-25) — вторая реализация той же функции в одном
# проекте была бы вторым местом, где она может разойтись с первым.
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"
# Генерация TS-зеркала контракта из `src/types.rs` (TL-51). Крейт стоит в
# dev-зависимостях, а не в обычных, и это не мелочь: `#[derive(TS)]`
# навешивается через `#[cfg_attr(test, ...)]`, то есть существует только в
# тестовой сборке. Следствия, ради которых так и сделано:
#   1. В РЕЛИЗНЫЙ граф не добавляется ни одного крейта. Проверено сравнением
#      `cargo tree -e normal --target <тройка> --prefix none` до и после —
#      разница пустая на всех трёх тройках.
#   2. В бандл не попадает код генератора: derive не разворачивается вне
#      `cfg(test)`, а `Config` и `TS::export` вызываются из
#      `src/types/bindings.rs`, который целиком под `#[cfg(test)]`.
# Цена измерена тем же способом на полном графе (`cargo tree` без `-e
# normal`): +3 крейта, и только в dev-графе — ts-rs, ts-rs-macros,
# termcolor. syn/quote/proc-macro2/thiserror переиспользуются, они в графе
# уже были.
#
# Фича `serde-compat` включена по умолчанию и здесь обязательна: без неё
# ts-rs не читает `serde(rename_all)`, `serde(tag)`, `serde(flatten)` и
# `serde(rename_all_fields)`, то есть сгенерировал бы змеиный регистр и
# развалил бы размеченные объединения.
ts-rs = "12"
# Управляемое время для тестов оркестрации скачивания (TL-44): лестница
# пауз перед повторами — 5 + 10 + 20 + 40 + 60 с, и ждать её по-настоящему
# набор не станет. Фича включается только в тестовой сборке (dev-зависимость
# того же крейта, что уже есть в графе), новых крейтов не добавляет и в
# бандл не попадает.
tokio = { version = "1", features = ["test-util"] }
