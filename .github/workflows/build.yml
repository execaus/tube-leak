name: build

# Два джоба: build — сборка инсталлятора под все целевые платформы, test —
# проверки репозитория (vitest, cargo test, clippy, fmt, type-check, eslint;
# TL-25). Оба висят на одних триггерах намеренно: проверка и сборка должны
# запускаться от одного события, иначе появляется коммит, проверенный, но
# не собранный, — или наоборот.
#
# Сборка инсталлятора под все целевые платформы (Windows, macOS, Linux —
# см. CLAUDE.md/Стек). Живой прогон в рамках эпика E1 не обязателен (Р-6);
# конфигурация должна существовать и корректно описывать сборку для всех
# трёх ОС (issue TL-9, критерий приёмки).
#
# macOS покрыта двумя джобами: macos-latest (Apple Silicon, arm64 — раннеры
# GitHub Actions сейчас на этой архитектуре) и macos-13 (Intel, x86_64) —
# чтобы обе целевые архитектуры macOS (см. CLAUDE.md/Стек) имели рабочую
# конфигурацию сборки, а не только хостовую архитектуру раннера.
#
# Linux собирается только как AppImage (см. CLAUDE.md, «Два независимых
# контура обновления» — .deb/.rpm обновляются системным пакетным
# менеджером, не плагином updater) — этот инвариант закреплён в
# src-tauri/tauri.conf.json (bundle.targets), здесь ничего дополнительно
# не ограничивается.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Новый пуш в ветку PR отменяет незавершённые прогоны предыдущего: четыре
# сборки бандла на пуш — дорого, а результат по устаревшему коммиту всё
# равно никому не нужен. Пуши в main не отменяются: там прогон привязан к
# коммиту, который уже в истории.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-13
            target: x86_64-apple-darwin
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # Tauri 2 Linux-зависимости для сборки AppImage (webkit2gtk, indicator,
      # rsvg и т.п.) — см. официальные Tauri v2 Linux prerequisites.
      - name: Install Linux system dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Install frontend dependencies
        run: npm ci

      # Доставка sidecar-бинарников (yt-dlp, ffmpeg) под тройку джоба — по
      # пину версия+SHA256, см. scripts/fetch-binaries (TL-6). Обязательно
      # до `tauri build`: externalBin резолвит их из src-tauri/binaries/.
      - name: Fetch sidecar binaries (yt-dlp, ffmpeg)
        run: node scripts/fetch-binaries/index.mjs --target ${{ matrix.target }}

      - name: Build installer
        run: npm run tauri build -- --target ${{ matrix.target }}

  # Проверки, которые до TL-25 не запускались в CI вообще: vitest, cargo
  # test (включая сторож tests/frontend_acl.rs), clippy, fmt, type-check и
  # eslint (issue #26). Ключевое, ради чего джоб существует: регрессию
  # вносит правка в src/ (область ui), а ловит её команда из области core —
  # `cargo test`. Без джоба ничто не заставит исполнителя ui её запустить.
  #
  # Джоб отдельный от build, а не шаги внутри него: build — матрица из
  # четырёх ОС, проверки же от платформы не зависят, и гонять их четырежды
  # незачем. Падение проверок при этом не отменяет сборку и наоборот —
  # видно сразу оба сигнала.
  #
  # Раннер macos-latest, хотя минуты на нём дороже ubuntu. Причина не в
  # удобстве: на ubuntu набор тестов Rust зависает (TL-25 разбирался с этим
  # живьём — `cargo test` не завершается за 25+ минут, шаг не снимается
  # даже `timeout`; отдельный дефект, к CI отношения не имеющий). До его
  # починки джоб на Linux красный не по делу, а джоб, которому не верят,
  # бесполезен. Компиляцию под Linux и Windows при этом никто не теряет —
  # её проверяет матрица build, собирающая бандл под все четыре тройки.
  test:
    runs-on: macos-latest
    # Страховка от зависшего шага: без неё раннер занят дефолтные 6 часов.
    timeout-minutes: 30

    # Разрешает cargo собраться с заглушками вместо настоящих ассетов: без
    # переменной build.rs останавливает сборку, потому что архив yt-dlp не
    # совпадает с sha256 из пина (TL-25). В профиле release переменная не
    # действует, так что бандл с заглушкой ею не собрать — а джоб build,
    # который бандл и собирает, её не задаёт вовсе.
    env:
      TUBE_LEAK_ALLOW_STUB_YTDLP: '1'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      # Фронтенд-проверки идут первыми: они дешёвые и не требуют ни
      # бинарников, ни собранного dist — чем раньше падают, тем меньше
      # минут тратится на компиляцию Rust ради заведомо красного прогона.
      - name: Run frontend tests (vitest)
        run: npm test

      - name: Type-check frontend (vue-tsc)
        run: npm run type-check

      - name: Lint frontend (eslint)
        run: npm run lint

      # Заглушки вместо настоящей доставки: тесты бинарники не запускают,
      # но build.rs + tauri-build обязаны их найти, иначе тестовый бинарник
      # не соберётся. Подробное обоснование — в самом скрипте.
      - name: Stub sidecar binaries
        run: node scripts/ci/stub-binaries.mjs

      # `tauri::generate_context!()` вшивает содержимое frontendDist (../dist)
      # в тестовый бинарник — сторож frontend_acl.rs резолвит ACL именно
      # через него. Без `npm run build` каталога dist нет и cargo test не
      # соберётся. Здесь `vite build` напрямую, а не `tauri build`: нужен
      # только dist, бандл собирает джоб build.
      - name: Build frontend (vite)
        run: npm run build

      - name: Check Rust formatting
        run: cargo fmt --check
        working-directory: src-tauri

      - name: Lint Rust (clippy)
        run: cargo clippy --all-targets -- -D warnings
        working-directory: src-tauri

      - name: Run Rust tests
        run: cargo test
        working-directory: src-tauri
